[project]
name = "eta"
version = "0.1.0"
description = "CLI for bus arrival information"
readme = "README.md"
authors = [
    { name = "ykchat" }
]
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
eta = "eta.cli.app:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# pixi 共通
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.dependencies]
python = "3.15.*"
pydantic = ">=2.14.4,<3"
httpx = ">=0.28.1,<0.29"
python-dotenv = ">=1.2.4,<2"
rich = ">=15.0.0,<16"
typer = ">=0.29.2,<0.30"

[tool.pixi.pypi-dependencies]
eta = { path = ".", editable = true }

[tool.pixi.tasks]
eta = "eta"
eta-bws = "bws run --project-id $BWS_PROJECT_ID -- eta"

# pixi dev

[tool.pixi.environments.dev]
features = ["dev"]
solve-group = "default"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.2.0,<10"
pyright = ">=1.1.414,<2"

[tool.pixi.feature.dev.tasks]
typecheck = "pyright"
test = "pytest"
coverity-capture = "rm -rf tmp/cov-int && coverity capture --dir tmp/cov-int --project-dir src"
coverity = { cmd = "tar czf tmp/eta-coverity.tgz -C tmp cov-int", depends-on = ["coverity-capture"] }

# pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

# pyright

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

# pixi audit

[tool.pixi.environments.audit]
features = ["audit"]
no-default-feature = true

[tool.pixi.feature.audit.dependencies]
python = "3.14.*"
pip-audit = ">=2.10.1,<3"
filelock = ">=4.3.0,<5"

[tool.pixi.feature.audit.tasks]
audit = "pip-audit --path .pixi/envs/dev/lib/python/site-packages --skip-editable"
