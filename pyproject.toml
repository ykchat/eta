[project]
name = "eta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ykchat", email = "6527865+ykchat@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
eta = "eta.cli.app:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.15.*"

[tool.pixi.pypi-dependencies]
eta = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.environments.dev]
features = ["dev"]
solve-group = "default"

[tool.pixi.tasks]
eta = "eta"

[tool.pixi.feature.dev.tasks]
typecheck = "pyright"
test = "pytest"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.2.0,<10"
pyright = ">=1.1.414,<2"
